<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trove — Admin Access</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0eb; --deep: #3d2c1e; --mid: #6b4f3a; --soft: #9a7b62;
    --gold: #c8873a; --amber: #e0a84a; --teal: #4a8fa0; --rose: #c06878;
    --border: rgba(184,136,80,0.25); --shadow: rgba(61,44,30,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(ellipse 80% 60% at 15% 5%, rgba(212,232,240,0.55), transparent 55%),
                radial-gradient(ellipse 60% 70% at 85% 95%, rgba(245,221,232,0.5), transparent 55%),
                linear-gradient(160deg, #f7f2ec, #ede4d6 40%, #f0e8f0);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg-dots {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35;
    background-image: radial-gradient(circle, rgba(184,136,80,0.18) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .card {
    position: relative; z-index: 1;
    background: rgba(255,252,248,0.92);
    backdrop-filter: blur(20px);
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 2.8rem 2.5rem;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 48px var(--shadow);
    text-align: center;
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  .logo-row {
    display: flex; align-items: center; justify-content: center; gap: 0.8rem; margin-bottom: 0.5rem;
  }
  .logo-icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--amber));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    box-shadow: 0 4px 14px rgba(200,135,58,0.35);
  }
  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 2rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #e0783a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub {
    color: var(--soft); font-size: 0.85rem; font-style: italic; margin-bottom: 2rem;
  }
  .admin-badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: rgba(200,135,58,0.12); color: var(--gold);
    border: 1.5px solid rgba(200,135,58,0.3);
    border-radius: 30px; padding: 0.3rem 1rem;
    font-size: 0.76rem; font-weight: 900; letter-spacing: 0.8px;
    text-transform: uppercase; margin-bottom: 1.8rem;
  }
  .cred-box {
    background: rgba(200,135,58,0.07);
    border: 1.5px solid rgba(200,135,58,0.2);
    border-radius: 14px; padding: 1.1rem 1.4rem;
    margin-bottom: 1.6rem; text-align: left;
  }
  .cred-title {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 1.5px;
    color: var(--teal); text-transform: uppercase; margin-bottom: 0.75rem;
  }
  .cred-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.45rem; font-size: 0.84rem;
  }
  .cred-label { color: var(--soft); font-weight: 600; }
  .cred-val {
    font-weight: 800; color: var(--deep);
    background: rgba(255,255,255,0.75); padding: 0.15rem 0.65rem;
    border-radius: 7px; border: 1px solid var(--border);
    font-family: monospace; font-size: 0.85rem;
  }
  .btn-enter {
    width: 100%; padding: 0.9rem;
    background: linear-gradient(135deg, var(--teal), #3a7a8f);
    color: #fff; border: none; border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; font-weight: 800;
    letter-spacing: 0.8px; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 4px 16px rgba(74,143,160,0.35);
  }
  .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,143,160,0.45); }
  .btn-back {
    width: 100%; padding: 0.75rem;
    background: transparent; color: var(--soft);
    border: 1.5px solid var(--border); border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem; font-weight: 700;
    cursor: pointer; transition: all 0.25s; margin-top: 0.6rem;
  }
  .btn-back:hover { border-color: rgba(184,136,80,0.5); color: var(--gold); background: rgba(200,135,58,0.05); }
  .divider { height: 1.5px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 1.4rem 0; }
  .warning {
    font-size: 0.76rem; color: var(--soft);
    line-height: 1.55; margin-top: 1rem;
    padding: 0.6rem 0.9rem;
    background: rgba(192,104,120,0.07);
    border-radius: 9px; border: 1px solid rgba(192,104,120,0.18);
  }
  .warning strong { color: var(--rose); }
</style>
</head>
<body>
<div class="bg-dots"></div>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">📚</div>
    <div class="logo-text">TROVE</div>
  </div>
  <p class="sub">A Treasure of Books — Library Management</p>

  <div class="admin-badge">🔐 Admin Portal</div>

  <div class="cred-box">
    <div class="cred-title">🗝 Admin Credentials</div>
    <div class="cred-row">
      <span class="cred-label">Email</span>
      <span class="cred-val">admin@library.com</span>
    </div>
    <div class="cred-row">
      <span class="cred-label">Password</span>
      <span class="cred-val">admin123</span>
    </div>
  </div>

  <button class="btn-enter" onclick="goAdmin()">
    🚀 Enter Admin Dashboard
  </button>

  <div class="divider"></div>

  <button class="btn-back" onclick="goHome()">
    ← Back to Main Site
  </button>

  <div class="warning">
    <strong>⚠ Note:</strong> This page is for librarians / administrators only.
    Student accounts should use the main login page.
    Data resets on page reload — this is a demo app.
  </div>
</div>

<script>
  function goAdmin() {
    // Store flag so index.html auto-logs in as admin
    sessionStorage.setItem('trove_autologin', 'admin');
    window.location.href = 'index.html';
  }
  function goHome() {
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
